# Run configuration. Select a profile with the first script argument
#   Rscript scripts/01_prism_daily.R dev
# or with the R_CONFIG_ACTIVE environment variable. Profiles inherit from `default`.
#
# All paths, extent, years and worker counts come from here so scripts are identical
# on the Windows laptop and the Ubuntu P720.
#
# data_root: chosen by OS. Override on any machine with the GSI_DATA_ROOT env variable.
# Outputs go to <data_root>/<run_name>/..., so dev/test/full never overwrite each other.
# scratch_root: temporary raw downloads (deleted after conversion). Defaults to data_root;
# override with GSI_SCRATCH_ROOT (P720: local disk, since data_root is on the NAS).

default:
  run_name: default
  data_root:
    windows: "C:/Users/Crimmins/data/gsi-pheno-regions"
    linux: "~/data/gsi-pheno-regions"
  # Bounding box in lon/lat (NAD83), or null for the full PRISM CONUS grid (no crop).
  bbox: null
  years:
    start: 1981
    end: 2025
  workers: 1
  # terra memory cap per worker (fraction of RAM). Keep workers * memfrac well under 1.
  memfrac: 0.4
  prism:
    base_url: "https://services.nacse.org/prism/data/get"
    region: us
    res: 4km
    vars: [ppt, tmin, tmax, vpdmax]
    sleep_sec: 2          # pause after every download request (PRISM example script uses 2 s)
    timeout_sec: 180
    retry_wait_sec: 60    # one retry per day on network/HTTP errors; never on server refusals
    max_days_per_year: null   # only for the quick `test` profile
    # Storage: variables listed here are written as INT2S with this GDAL scale factor
    # (0.01 -> 0.01 degC / 0.01 hPa steps, max error 0.005). terra applies it on read.
    # ppt stays float32 (compresses well; INT2S x0.01 would cap daily totals at 327 mm).
    scale:
      tmin: 0.01
      tmax: 0.01
      vpdmax: 0.01
    drop_raw: true        # delete daily raw tifs once the variable-year file is written and checked
    user_agent: "gsi-pheno-regions (University of Arizona Cooperative Extension; R httr2)"
  # ntfy push notifications. Topic comes from the GSI_NTFY_TOPIC env variable (not here,
  # since anyone with the topic name can read it); unset = notifications off.
  notify:
    enabled: true
    server: "https://ntfy.sh"   # or a self-hosted ntfy URL; GSI_NTFY_SERVER overrides
    download_updates: true      # one low-priority message per finished variable-year download
    max_errors: 10              # error notifications per run before muting

  # Herbaceous mask (03_herb_mask.R) from Annual NLCD land cover (30 m, CONUS Albers).
  # Class shares are computed per 4 km cell for each year, averaged across years, and
  # stored for every class below; the mask is a rule on those shares (decided Oct 4).
  herb_mask:
    nlcd_url: "https://www.mrlc.gov/downloads/sciweb1/shared/mrlc/data-bundles/Annual_NLCD_LndCov_{year}_CU_C1V2.zip"
    nlcd_years: [2001, 2012, 2024]
    agg_factor: 33            # 30 m -> ~1 km in Albers before averaging onto the 4 km grid
    classes:                  # stored shares (of valid NLCD pixels): name: NLCD code
      water: 11
      grass: 71
      shrub: 52
      pasture: 81
      crops: 82
      wetland_herb: 95
    # Scope (decided Oct 5): regions are wall-to-wall CONUS (all PRISM land cells), so NPN
    # and iNaturalist observations anywhere fall in a region. These layers describe and
    # optionally weight cells; they do not define the clustering domain.
    herb_classes: [grass, shrub]   # core herbaceous share (grassland + shrub/scrub)
    broad_classes: [grass, shrub, pasture]   # open-herbaceous share incl. pasture/hay (East)
    # Strict mask: cells whose satellite curves should be herbaceous-dominated (Cut B
    # comparison and sensitivity runs), not the analysis domain.
    min_herb_share: 0.5            # core herb share of LAND area (water excluded)
    max_crop_share: 0.25           # crop share of land area

  # Cut B satellite curves (decided Oct 5): MODIS 16-day vegetation indices, Terra + Aqua
  # (composites 8 days apart -> ~8-day sampling), via AppEEARS area requests subset to the
  # profile bbox (CONUS when null). AppEEARS has no 0.05 deg CMG products, so the 1 km
  # products are used and aggregated to the 4 km PRISM grid as each year is stacked.
  # NDVI for greenness, NDII7 (NIR vs 2.1 um MIR) for curing.
  # Upgrade path for curing fidelity: MCD43A4 (500 m daily NBAR, all bands) in AppEEARS.
  cutb:
    api: "https://appeears.earthdatacloud.nasa.gov/api"
    products: ["MOD13A2.061", "MYD13A2.061"]
    # First composite of each product: years before this are never requested
    # (Aqua launched May 2002; its first 16-day composite is early July 2002).
    first_date:
      MOD13A2.061: "2000-02-18"
      MYD13A2.061: "2002-07-04"
    # short name: regex matched against the product's AppEEARS layer names (checked at run time)
    layers:
      ndvi: "16_days_NDVI$"
      evi: "16_days_EVI$"
      red: "16_days_red_reflectance$"
      nir: "16_days_NIR_reflectance$"
      mir: "16_days_MIR_reflectance$"
      doy: "16_days_composite_day_of_the_year$"
      reliability: "16_days_pixel_reliability$"
    # Aggregation to the 4 km grid: mean of 1 km pixels whose pixel reliability is in
    # valid_reliability (0 good, 1 marginal; 2 snow/ice, 3 cloudy, -1 fill). Also written per
    # composite: n_valid (count of valid 1 km pixels) and snow_frac (share flagged snow/ice).
    value_vars: [ndvi, evi, red, nir, mir, doy]
    valid_reliability: [0, 1]
    conus_bbox: {xmin: -125.1, ymin: 24.0, xmax: -66.4, ymax: 50.0}
    max_pending_tasks: 4      # AppEEARS tasks queued at once (one task = one product-year)
    poll_minutes: 5

# Laptop development: small Arizona box, recent complete years, 2 workers.
dev:
  run_name: dev
  bbox:
    xmin: -115.0
    ymin: 31.25
    xmax: -108.95
    ymax: 37.05
  years:
    start: 2023
    end: 2025
  workers: 2
  memfrac: 0.3

# Few-minute smoke test of the whole chain (5 days, 2 variables, 1 year).
# Uses 2022 (outside the dev years) so smoke tests don't re-fetch files dev already
# downloaded: PRISM refuses a third download of the same file within 24 h.
test:
  inherits: dev
  run_name: test
  years:
    start: 2022
    end: 2022
  prism:
    vars: [ppt, tmax]
    max_days_per_year: 5

# P720 production: CONUS, many workers.
# years: download order, not the study period (still open in the plan doc). 2001 is the
# first full MODIS year, so 2001-2025 is needed for any Cut A vs Cut B comparison. To extend
# back later, lower `start` and rerun; finished years are skipped.
full:
  run_name: full
  bbox: null
  years:
    start: 2001
    end: 2025
  workers: 8
  memfrac: 0.08
