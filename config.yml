# Run configuration. Select a profile with the first script argument
#   Rscript scripts/01_prism_daily.R dev
# or with the R_CONFIG_ACTIVE environment variable. Profiles inherit from `default`.
#
# All paths, extent, years and worker counts come from here so scripts are identical
# on the Windows laptop and the Ubuntu P720.
#
# data_root: chosen by OS. Override on any machine with the GSI_DATA_ROOT env variable.
# Outputs go to <data_root>/<run_name>/..., so dev/test/full never overwrite each other.
# scratch_root: temporary raw downloads (deleted after conversion). Defaults to data_root;
# override with GSI_SCRATCH_ROOT (P720: local disk, since data_root is on the NAS).

default:
  run_name: default
  data_root:
    windows: "C:/Users/Crimmins/data/gsi-pheno-regions"
    linux: "~/data/gsi-pheno-regions"
  # Bounding box in lon/lat (NAD83), or null for the full PRISM CONUS grid (no crop).
  bbox: null
  years:
    start: 1981
    end: 2025
  workers: 1
  # terra memory cap per worker (fraction of RAM). Keep workers * memfrac well under 1.
  memfrac: 0.4
  prism:
    base_url: "https://services.nacse.org/prism/data/get"
    region: us
    res: 4km
    vars: [ppt, tmin, tmax, vpdmax]
    sleep_sec: 2          # pause after every download request (PRISM example script uses 2 s)
    timeout_sec: 180
    retry_wait_sec: 60    # one retry per day on network/HTTP errors; never on server refusals
    max_days_per_year: null   # only for the quick `test` profile
    # Storage: variables listed here are written as INT2S with this GDAL scale factor
    # (0.01 -> 0.01 degC / 0.01 hPa steps, max error 0.005). terra applies it on read.
    # ppt stays float32 (compresses well; INT2S x0.01 would cap daily totals at 327 mm).
    scale:
      tmin: 0.01
      tmax: 0.01
      vpdmax: 0.01
    drop_raw: true        # delete daily raw tifs once the variable-year file is written and checked
    user_agent: "gsi-pheno-regions (University of Arizona Cooperative Extension; R httr2)"
  # ntfy push notifications. Topic comes from the GSI_NTFY_TOPIC env variable (not here,
  # since anyone with the topic name can read it); unset = notifications off.
  notify:
    enabled: true
    server: "https://ntfy.sh"   # or a self-hosted ntfy URL; GSI_NTFY_SERVER overrides
    download_updates: true      # one low-priority message per finished variable-year download
    max_errors: 10              # error notifications per run before muting

  # Herbaceous mask (03_herb_mask.R) from Annual NLCD land cover (30 m, CONUS Albers).
  # Class shares are computed per 4 km cell for each year, averaged across years, and
  # stored for every class below; the mask is a rule on those shares (decided Oct 4).
  herb_mask:
    nlcd_url: "https://www.mrlc.gov/downloads/sciweb1/shared/mrlc/data-bundles/Annual_NLCD_LndCov_{year}_CU_C1V2.zip"
    nlcd_years: [2001, 2012, 2024]
    agg_factor: 33            # 30 m -> ~1 km in Albers before averaging onto the 4 km grid
    classes:                  # stored shares (of valid NLCD pixels): name: NLCD code
      water: 11
      grass: 71
      shrub: 52
      pasture: 81
      crops: 82
      wetland_herb: 95
    # Scope (decided Oct 5): regions are wall-to-wall CONUS (all PRISM land cells), so NPN
    # and iNaturalist observations anywhere fall in a region. These layers describe and
    # optionally weight cells; they do not define the clustering domain.
    herb_classes: [grass, shrub]   # core herbaceous share (grassland + shrub/scrub)
    broad_classes: [grass, shrub, pasture]   # open-herbaceous share incl. pasture/hay (East)
    # Strict mask: cells whose satellite curves should be herbaceous-dominated (Cut B
    # comparison and sensitivity runs), not the analysis domain.
    min_herb_share: 0.5            # core herb share of LAND area (water excluded)
    max_crop_share: 0.25           # crop share of land area

  # Cut B satellite curves (decided Oct 5): MODIS 16-day vegetation indices, Terra + Aqua
  # (composites 8 days apart -> ~8-day sampling), via AppEEARS area requests subset to the
  # profile bbox (CONUS when null). AppEEARS has no 0.05 deg CMG products, so the 1 km
  # products are used and aggregated to the 4 km PRISM grid as each year is stacked.
  # NDVI for greenness, NDII7 (NIR vs 2.1 um MIR) for curing.
  # Upgrade path for curing fidelity: MCD43A4 (500 m daily NBAR, all bands) in AppEEARS.
  cutb:
    api: "https://appeears.earthdatacloud.nasa.gov/api"
    products: ["MOD13A2.061", "MYD13A2.061"]
    # First composite of each product: years before this are never requested
    # (Aqua launched May 2002; its first 16-day composite is early July 2002).
    first_date:
      MOD13A2.061: "2000-02-18"
      MYD13A2.061: "2002-07-04"
    # short name: regex matched against the product's AppEEARS layer names (checked at run time)
    layers:
      ndvi: "16_days_NDVI$"
      evi: "16_days_EVI$"
      red: "16_days_red_reflectance$"
      nir: "16_days_NIR_reflectance$"
      mir: "16_days_MIR_reflectance$"
      doy: "16_days_composite_day_of_the_year$"
      reliability: "16_days_pixel_reliability$"
    # Aggregation to the 4 km grid: mean of 1 km pixels whose pixel reliability is in
    # valid_reliability (0 good, 1 marginal; 2 snow/ice, 3 cloudy, -1 fill). Also written per
    # composite: n_valid (count of valid 1 km pixels) and snow_frac (share flagged snow/ice).
    value_vars: [ndvi, evi, red, nir, mir, doy]
    valid_reliability: [0, 1]
    conus_bbox: {xmin: -125.1, ymin: 24.0, xmax: -66.4, ymax: 50.0}
    max_pending_tasks: 4      # AppEEARS tasks queued at once (one task = one product-year)
    poll_minutes: 5

  # Cut B curve step (06_cutb_curves.R), defaults agreed Oct 7 2026.
  cutb_curves:
    min_valid: 5              # composite kept if >= 5 valid 1 km pixels (of up to ~25 per cell)
    full_valid: 20            # smoothing weight = min(n_valid / full_valid, 1)
    max_snow_frac: 0.5        # composite dropped if more than half its pixels are snow/ice
    offset_min_pairs: 6       # Terra-Aqua pairs needed per cell-year for an offset
    window: {start_month: 10, end_month: 3}   # year Y smoothed over Oct 1 (Y-1) .. Mar 31 (Y+1)
    node_days: 4              # smoothing grid spacing (days); obs go to the nearest node
    lambda: 30                # Whittaker penalty on that grid (tested Oct 7: 5 noisy, 200 merges peaks)
    envelope: {iter: 1, below_weight: 0.5}   # down-weight obs below the first fit, refit
    min_obs_window: 20        # nodes with observations needed in the window, else NA
    curve_step: 8             # output curves at DOY 1, 9, ..., 361 (46 values)
    season_halfwidth_days: 183   # base (minimum) and crossings searched within +/- this of the peak
    min_amp: 0.03             # season dates NA when amplitude is below this (no clear season)
    green_frac: 0.5           # green spell: NDVI above base + 0.5 x amplitude ...
    min_spell_days: 16        # ... for at least 16 days (n_green counts them within year Y)

  # Cut B regions (07_cutb_regions.R): cluster the across-year median curves (NDVI, NDII7;
  # 46 values each, DOY 1..361) and compare with the Cut A partitions.
  cutb_regions:
    variants:
      raw:                    # curve level + shape: PCA per index, each index total variance 1
        shape: false
      shape:                  # timing / shape only: each cell's curve centred on its mean and
        shape: true           # divided by max(amplitude, min_amp_scale)
        min_amp_scale: 0.05
    default_variants: [raw, shape]
    pca_var: 0.99
    k_range: [4, 20]
    compare_to:               # Cut A k-means rasters (clusters/<dir>/a1_kmeans.tif) to score against
      A1_groups: a1_groups
      A2_groups: a2_groups
    curve_fig_k: [7, 10, 13]  # cluster-mean curve figures and maps at these k

  # Evaluation (30_compare_ab.R, 31_obs_regions.R): partitions are k-means label rasters
  # under clusters/ with bands k04, k05, ...; `geo` = k-means on location only (baseline:
  # any compact blobs of the same number).
  evaluation:
    partitions:
      A1_groups: a1_groups/a1_kmeans.tif
      A2_groups: a2_groups/a1_kmeans.tif
      A2_herbw: a2_groups_herbw/a1_kmeans.tif
      A3_groups: a3_groups/a1_kmeans.tif
      A3_novpd: a3_groups_novpd/a1_kmeans.tif
      A3_kbdi: a3_groups_kbdi/a1_kmeans.tif
      B_raw: b_raw/b_kmeans.tif
      B_shape: b_shape/b_kmeans.tif
    geo_baseline: true
    k: [4, 20]
    report_k: [7, 10, 13]
    # 30: how much of the satellite curve variance (Cut B PCA features, and single metrics)
    # each partition explains, all cells and the strict herbaceous mask. Two feature sets:
    # level_shape (curves as they are) and timing (each curve scaled by its own amplitude).
    curve_features:
      level_shape: b_raw/b_features.tif
      timing: b_shape/b_features.tif
    metrics: [ndvi_amp, sos20, ndvi_peak_doy, eos20, gsl20, cure50, ndii_amp]
    # 31: observations from the GSI study exploration (derived .rds tables). GSI_STUDY_DIR
    # overrides. Sites are reduced to their median date across years first.
    study_dir:
      windows: "C:/Users/Crimmins/RProjects/GrowingSeasonIndex/study"
      linux: "~/RProjects/GrowingSeasonIndex/study"
    min_years_site: 1
    # 31: spatial-block bootstrap of the observation scores at report_k (sites resampled in
    # block_deg x block_deg blocks, since nearby sites are not independent). Paired: every
    # partition is scored on the same resample, so differences get their own range.
    boot:
      n_boot: 500
      block_deg: 2
      probs: [0.05, 0.95]
      pairs:                    # differences first - second
        - [A2_groups, A1_groups]
        - [A1_groups, geo]
        - [A2_groups, geo]
        - [B_shape, A2_groups]
        - [A2_herbw, A2_groups]
        - [A3_groups, A2_groups]
        - [A3_novpd, A3_groups]
        - [A3_kbdi, A3_groups]

  # Year-to-year synchrony (33_synchrony.R, P720): share of the cells' yearly anomalies in
  # the satellite season metrics explained by their region's mean anomaly.
  synchrony:
    metrics: [sos20, ndvi_peak_doy, eos20, cure50]
    min_years: 10               # cells need at least this many valid years
    max_abs_anomaly: 90         # days; larger anomalies = season jumps, dropped
    region_domain: herb         # per-region numbers and cell correlations on strict herb cells

  # GSI-per-region model test (34_gsi_model.R, P720): fit GSI ramp thresholds (Tmin, VPD,
  # daylength start, 28-day precipitation) to satellite green-up (sos20) and curing (NDII7
  # cure50) dates, against the GSI's own season dates (sos20 / eos50 of the smoothed index).
  # Models: NFDRS and FEMS defaults (no fitting), one CONUS-wide fit, one fit per region (for
  # each partition and k below), and the cell's own typical date (climatology). Two folds:
  # fit on odd years, score on even, and the reverse.
  gsi_model:
    n_sample: 4000              # strict herbaceous cells, random (seed below)
    min_sat_years: 10           # cells need a satellite green-up in at least this many years
    min_cells: 25               # regions with fewer sampled cells use the CONUS fit
    conus_fit_cells: 1500       # subsample for the CONUS-wide fit
    partitions: [A1_groups, A2_groups, A2_herbw]
    k: [7, 13]                  # (Oct 8 first run: 7, 10 and 13 within ~1 day)
    moisture: [precip, kbdi, none]   # fitted separately; "best" = lowest fitting-year error
    smooth: 28                  # fitted models: FEMS smoothing
    maxit: 250                  # Nelder-Mead evaluations per search (first run: 150, mostly hit)
    restarts: 1                 # extra searches from the best point (kept only while improving)
    penalty_days: 60            # missing GSI date where the satellite has one
    cap_days: 90                # errors capped (season jumps, e.g. spring vs monsoon), as in 33
    workers: 36                 # forked on Linux (shared memory); sequential on Windows
    seed: 20261008

  # GSI curing forms (35_gsi_curing.R, P720; Oct 9 2026): same sample, folds, loss and scores
  # as gsi_model (unset keys come from there), but the model's form varies: moisture memory x
  # how season dates are read from the index (R/gsi_model.R gm_moist, gm_cross). Every
  # combination is fitted CONUS-wide and per region for the working regions (A2, k 7 and 13).
  # v2 (Oct 10): fallback to the typical date where the GSI gives none (v1's fixed penalty let
  # fits skip curing dates in hard regions), longer search, kbdi30 / precip60 dropped (v1: no
  # better than kbdi / precip90).
  gsi_curing:
    moisture: [kbdi, precip90]
    cross: [rel, rel_split, abs_nfdrs4, abs_split]
    missing: fallback             # or "penalty" (v1)
    target: cure50                # satellite curing target; GSI_CURING_TARGET=eos50 for the NDVI end of season
    target_forms:                 # forms for the other targets (the four that won most often at cure50)
      eos50: [kbdi-abs_nfdrs4, kbdi-rel_split, precip90-abs_split, precip90-rel]
      eos20: [kbdi-abs_nfdrs4, kbdi-rel_split, precip90-abs_split, precip90-rel]
    form_sets:                    # GSI_CURING_FORMS=<name>: run only these forms (Oct 11)
      # soil-water bucket (swb: no VPD or daylength) and the anchored reading (rel_anchor: the
      # season nearest the cell's usual one, for two-season climates), with the GSI's best
      # moisture terms for comparison
      newforms: [swb-rel_split, swb-abs_split, swb-rel_anchor, kbdi-rel_anchor, precip90-rel_anchor]
    anchor_days: 75               # rel_anchor: peak searched within +/- this of the usual mid-season
    maxit: 600                    # v1: 250, 99 % of fits used it all
    reference_form: kbdi-rel      # the 34 v2 form most regions picked
    partitions: [A2_groups]
    k: [7, 13]
    workers: 24                   # forked; run alone, not next to another big job
    max_big: 8                    # CONUS-sized fits running at once (~2 GB each; Oct 9 OOM with 32)

  # Target check (36_curing_target_check.R, laptop; Oct 10 2026): are the satellite green-up
  # and curing dates the GSI tests score against consistent with ground observations of the
  # same events? Ground sets as in 31 (R/obs.R); satellite metrics from Cut B (06).
  target_check:
    partition: A2_groups
    k: 13
    min_years: 3                # site-years per site for the year-to-year (anomaly) comparison
    pairs:
      - {set: grass_greenup, metric: sos20, label: "NPN grass green-up vs NDVI green-up (sos20)"}
      - {set: grass_curing, metric: cure50, label: "NPN grass curing (50 % green) vs NDII7 curing"}
      - {set: grass_curing, metric: eos50, label: "NPN grass curing (50 % green) vs NDVI end (eos50)"}
      - {set: grass_cured, metric: cure50, label: "NPN grass cured vs NDII7 curing"}
      - {set: grass_cured, metric: eos20, label: "NPN grass cured vs NDVI end (eos20)"}
      - {set: lfmc_herb_decline, metric: cure50, label: "Herb LFMC 50 % decline vs NDII7 curing"}

  # Curing cue screening (37_curing_cues.R, P720; Oct 11 2026): per working region, which yearly
  # weather cues (R/cues.R) go with early and late satellite curing years, and how much of the
  # year-to-year curing variation a small cue model predicts in held-out years.
  curing_cues:
    partition: A2_groups
    k: 13
    min_cells: 25               # sampled cells a region needs
    max_cues: 3                 # cues per model (forward selection on the fitting years)
    min_gain: 0.01              # each added cue must raise the fitting-year R^2 by this much
    max_abs_anomaly: 90         # days; larger departures are season jumps, dropped (as in 33)

  # Typical curing date plus a weather adjustment (38_curing_adjust.R, P720): cues end at the
  # cell's typical date minus the lead time, so the adjustment is known in advance.
  curing_adjust:
    partition: A2_groups
    k: 13
    min_cells: 25
    targets: [eos50, cure50]
    lead_days: [0, 14, 30]      # cutoff = typical date minus this; 14 is the operational case
    max_cues: 3
    min_gain: 0.01
    max_adj_days: 60            # adjustment clamped to +/- this
    cap_days: 90                # error cap, as in 35
    max_abs_anomaly: 90         # season jumps left out of fitting (still scored)

  # Packaged rules (40_rules_build.R, 41_rules_predict.R; P720), decided Oct 13 2026 after the
  # ground checks: each cell's typical green-up and curing date everywhere; curing shifted by a
  # weather adjustment (cues to 14 days before the typical date) in adjust_regions (map numbers).
  rules:
    partition: A2_groups
    k: 13
    adjust_regions: [3, 11]     # monsoon Southwest; California annual grasslands (provisional)
    tested_regions: [2, 3, 5, 10, 11, 13]   # NPN grass sites enough for a ground check (39); confidence class 1
    lead_days: 14
    max_cues: 3
    min_gain: 0.01
    max_adj_days: 60
    max_abs_anomaly: 90
    chunk_cells: 2500           # cells per chunk for the per-cell cue climatology
    workers: 8
    example_years: [2021, 2023] # hindcast years drawn on the page

  # NPN grass curing study (50+; scope: project doc gsi-npn-curing-study-scope.md). Decided
  # Oct 15 2026: code here; managed sites flagged and reported both ways; C3/C4 drafted from
  # the literature for review; defaults below as starting values, each a sensitivity.
  npn_study:
    years: {start: 2001, end: 2025}   # PRISM daily available from 2001
    vars: [ppt, tmin, tmax, vpdmax]
    min_readings: 12                  # per plant-year
    memory_days: [15, 30, 60]         # time constants of the antecedent P - PET index
    daylength_gates_h: [12, 11]       # fall gates for northern C3 curing
    normals: {start: 2002, end: 2025}   # PRISM daily on the P720 starts in 2001 (needed as the year before)
    min_years: 3                      # 52: series need >= 3 years with the date
    lead_days: 14                     # 52: lead-time drivers end at the typical date minus this
    max_predictors: 4                 # 52: L3 forward selection
    l2_window_days: 60                # 52: L2 curing rule searches the typical date +/- this
    # Sensitivity runs of 52-54: `Rscript scripts/5x_*.R full <name>`; outputs go to
    # <run_dir>/npn_study/sens/<name>/ (main results untouched).
    sensitivity:
      no1617:                         # 16 Oct: NEON plants peaked lower in 2016-17 at 11 of 18
        exclude_years: [2016, 2017]   #   sites (likely a judging / protocol change, not weather)

  # Fire activity study (companion; scripts 60-69, page report/fire_study.qmd; scope in the
  # project doc gsi-fire-study-scope.md). Decided Oct 17 2026; values marked (verify) are
  # checked when the build starts (FPA-FOD checked Oct 17).
  fire_study:
    partition: A2_groups              # regions = A2 k13 map numbers (rules/typical_dates.tif `region`)
    k: 13
    fod:
      # 7th edition (Short 2026, RDS-2013-0009.7; the abstract calls it the "sixth update"),
      # 1992-2024, 2.66 M records. Checked Oct 17 2026 against the metadata: field names as in
      # the 6th edition; cause classes Human / Natural / Missing data/not specified/undetermined;
      # size classes A-G (C = 10.0-99.9 ac); NAD83 lon/lat; tables Fires and
      # NWCG_UnitIDActive_20200123. Planned ignitions (prescribed fires) are excluded except
      # escapes that needed suppression (Short 2014, ESSD); the 7th edition metadata is silent.
      edition: "FPA_FOD_20260615"
      url: "https://www.fs.usda.gov/rds/archive/products/RDS-2013-0009.7/RDS-2013-0009.7_Data_Format3_GPKG.zip"
      layer: Fires
      years: {start: 2001, end: 2024}
      min_size_ac: 10                 # size class C and up = primary outcome
      lightning_class: "Natural"      # NWCG_CAUSE_CLASSIFICATION values
      human_class: "Human"
      drop_general_causes: ["Debris and open burning"]   # flagged in 60, dropped in 65; sensitivity keeps them
      exclude_states: [AK, HI, PR]
      rx_name_pattern: "\\bRX\\b|PRESCRIB|\\bBROADCAST BURN|\\bPILE BURN"   # flag only (prescribed-looking names)
      fields: [FOD_ID, FPA_ID, SOURCE_SYSTEM_TYPE, NWCG_REPORTING_AGENCY, FIRE_NAME, MTBS_ID,
               ICS_209_PLUS_INCIDENT_JOIN_ID, FIRE_YEAR, DISCOVERY_DATE, DISCOVERY_DOY,
               NWCG_CAUSE_CLASSIFICATION, NWCG_GENERAL_CAUSE, CONT_DATE, FIRE_SIZE, FIRE_SIZE_CLASS,
               LATITUDE, LONGITUDE, OWNER_DESCR, STATE, FIPS_CODE]
    firms:
      # NASA FIRMS area API (checked Oct 17 2026): /api/area/csv/<MAP_KEY>/<SOURCE>/<w,s,e,n>/<days 1-5>/<YYYY-MM-DD>;
      # sources VIIRS_SNPP_SP / _NRT (S-NPP from 2012-01-20), VIIRS_NOAA20_SP / _NRT (from 2018-04-01);
      # SP replaces NRT ~5 months after acquisition; 5,000 transactions per 10 min per key.
      # Key from the FIRMS_MAP_KEY environment variable only (~/.Renviron), never here.
      primary: "VIIRS_SNPP"           # single primary series; NOAA-20 as a check
      check: "VIIRS_NOAA20"
      years: {start: 2012, end: 2025}
      api: "https://firms.modaps.eosdis.nasa.gov/api/area/csv"
      status_url: "https://firms.modaps.eosdis.nasa.gov/mapserver/mapkey_status/"
      bbox: {xmin: -125.1, ymin: 24.0, xmax: -66.4, ymax: 50.0}   # CONUS request box (as cutb)
      keep_types: [0]                 # SP `type`: 0 vegetation fire; 1 volcano, 2 static land source, 3 offshore dropped
      window_days: 5                  # days per request: FIRMS rejects more than 5 (checked on the P720, Oct 17 2026)
      sleep_sec: 1
      timeout_sec: 300
      progress_every: 1               # progress line every N downloaded pieces (count, rows, MB, time, ETA)
      fallback_dates:                 # used only if the data_availability call fails
        VIIRS_SNPP_SP: {min: "2012-01-20", max: "2026-04-30"}
        VIIRS_SNPP_NRT: {min: "2026-05-01", max: "2026-10-16"}
        VIIRS_NOAA20_SP: {min: "2018-04-01", max: "2026-04-30"}
        VIIRS_NOAA20_NRT: {min: "2026-05-01", max: "2026-10-16"}
    link:                             # 63: VIIRS detections -> reported fires (decision 12 screens)
      mtbs_buffer_m: 750              # perimeter buffer (375 m pixel + geolocation)
      mtbs_max_days: 180              # detection within ig_date - 1 .. ig_date + this
      fod_base_km: 1.5                # search radius = this + equivalent-circle radius of the final size
      fod_default_days: {A: 1, B: 1, C: 2, D: 6, E: 15, F: 47, G: 84}   # no containment date: 90th pct duration by size class (7th ed.)
      crop_max: 0.5                   # cell crop share at or above this = cropland detection
    burned_area: {source: fod, mtbs_check_years: {start: 2001, end: 2023}}   # decided Oct 17: FPA-FOD final size by discovery date; MTBS = linking + fuel-burned check
    viirs_outcome: {years: {start: 2012, end: 2024}, exclude_regions: [13]}   # decided Oct 18: no linking after 2024 (FPA-FOD / MTBS end); 13 = ag / prescribed burning
    viirs_fill: {fill_from: VIIRS_NOAA20, rule: whole_conus_days_without_primary, flag: true, sensitivity_drop_filled: true}   # decided Oct 17
    mtbs:
      # MTBS burned area boundaries (v12.0, April 2025: 1984-2024; 2023-2024 still being mapped per
      # the MTBS release schedule, checked Oct 17 2026; 61 measures completeness against FPA-FOD).
      # Thresholds: >= 1,000 ac West, >= 500 ac East (prescribed fires too).
      url: "https://edcintl.cr.usgs.gov/downloads/sciweb1/shared/MTBS_Fire/data/composite_data/burned_area_extent_shapefile/mtbs_perimeter_data.zip"
      years: {start: 2001, end: 2024}
      wildfire_types: ["Wildfire", "Wildland Fire Use"]   # unplanned ignitions; Prescribed Fire and Other kept but flagged
      # (v12.0 types: Wildfire, Prescribed Fire, Other, Wildland Fire Use; "Other" is 2 % linked to
      # FPA-FOD, mostly the Southeast: not wildfire)
      exclude_states: [AK, HI, PR]
      check_min_acres: 1000           # completeness check: FPA-FOD wildfires at least this size
      fields: [Event_ID, irwinID, Incid_Name, Incid_Type, Map_Prog, Asmnt_Type, BurnBndAc,
               BurnBndLat, BurnBndLon, Ig_Date]
    pilot_regions: [3, 6, 12, 11, 10, 13]   # A2 k13 map numbers
    # Outcome and cover decisions (Oct 17 2026, after the first FPA-FOD run):
    outcome:
      primary: all_causes             # C+ wildfires, debris burning removed, all causes (continuous across the 2020-21 reporting change)
      cause_split_years: {start: 2001, end: 2019}   # lightning vs human only before the change; unknown left out
      unknown_as_human_sensitivity: true            # extra run counting unknown cause as human
      cause_split_skip_regions: [11]  # California: totals only (lightning ~4 %)
    ignition_term: none               # lightning fire counts dropped as the ignition proxy (relabelled after 2019; partly the outcome)
    era_check: {from_year: 2020}      # sensitivity only: region x (year >= 2020) indicator
    # Herbaceous share used for weighting and cover screens: NLCD shares of land (nlcd_shares.tif)
    fuel_classes: [grass, shrub, pasture, wetland_herb]
    herb_weighted_regions: [13]       # mixed cover: all fires kept, phenology weighted by fuel share
    # Phenology predictor taken from herbaceous-dominated cells only, applied to the whole region
    # (satellite dates in crop-dominated cells track crops)
    pheno_source: {regions: [13, 10], min_fuel_share: 0.35}
    cover_sensitivity: {regions: [13], top_fraction: 0.333}   # fires in the top third of cells by fuel share (instead of the strict mask)
    # Discovery week (decided Oct 18): fixed 7-day blocks from Jan 1; days 365-366 fold into week 52
    week: {scheme: fixed7_jan1, n_weeks: 52}
    # Region 10 VIIRS check (decided Oct 18): unlinked non-crop detections share the summer peak
    # there, so 66 adds a run counting all non-crop detections in 10 (linked or not)
    viirs_unlinked_sensitivity_regions: [10]
    # 68: C3/C4 gap test (decided Oct 19: two-pulse greenness cells in the Plains)
    c3c4: {regions: [10, 2], min_sep_days: 48, dip_frac: 0.15, peak_frac: 0.4, half_window_days: 14, n_boot: 2000}
    # 65/66 GSI comparison (Oct 19): cured share from GSI dates (12_gsi.R variants): NFDRS2016 as published
    # (Tmin x VPD x daylength) and FEMS with KBDI (best curing form in 35)
    gsi_compare: [nfdrs_none, fems_kbdi]
    snow_regions: [10, 13]            # snow-off date in the baseline
    # Dryness baselines, all from PRISM (decided Oct 18: ppet60 added as the simple, readable
    # companion of the NFDRS 1000-h moisture; fit the model with ppet60 first, then swap in dfm1000)
    baseline: {primary: dfm1000, simple: ppet60, checks: [kbdi, vpd30]}
    # 64_fire_dfm.R: daily dryness per cell, aggregated to region x day (equal and fuel-share
    # weights). Equations in R/fire_dfm.R.
    dfm:
      chunk_rows: 2                   # grid rows per worker task (all PRISM years in memory: ~4 GB peak per worker)
      spinup: repeat_first_year       # run the first year once before the series (sets 1000-h, KBDI, snow states)
      fr1000: 0.3068                  # 1 - 0.82 exp(-168/1000), NFDRS 1978
      rain_rate_in_h: {dry: 0.25, wet: 0.05}   # NFDRS rain-duration rate: classes 1-2 / 3-4
      dry_class: {ai_warm_lt: 0.5}  # classes 1-2 where Apr-Sep P/PET (Hargreaves) < 0.5 (decided Oct 18; optional ai_ann_lt, unused)
      max_rain_hours: 8
      photo_method: geometric
      ppet_days: 60                   # rain minus Hargreaves PET, trailing sum (mm)
      vpd_days: 30                    # trailing mean of PRISM VPDmax (kPa)
      vpd_short_days: 7               # short-term VPD for the hot-spell check (Oct 19)
      kbdi_interception_in: 0.2
      snow: {t_snow_c: 1.0, t_melt_c: 0.0, ddf_mm_c: 3.0, swe_min_mm: 5, snowoff_by: "07-31"}
    curing_metric: eos50
    greenup_metric: sos20

  # Region profiles (32_region_profiles.R, laptop): what each candidate region looks like.
  # Per region: climate feature medians and 25-75 % ranges (all cells), satellite season
  # dates and curves (all cells and strict herbaceous cells), ground-observation dates, and a
  # crosswalk from fine to coarse regions. Region numbers and colours match the report maps
  # (colours matched to report: region_maps[1]; numbers 1..k south to north in that order).
  # Features: "<source>:<band>"; sources b1med, b2med, b2var, static (elev), herb
  # (herb_share.tif). DOY features are shown as dates.
  region_profiles:
    sets:
      - {partition: A1_groups, k: 10, label: "Climate A1, 10 regions"}
      - {partition: A2_groups, k: 7, label: "Climate A2, 7 regions"}
      - {partition: A2_groups, k: 13, label: "Climate A2, 13 regions"}
      - {partition: A2_herbw, k: 13, label: "Climate A2, herbaceous-weighted, 13 regions"}
    crosswalk:                  # fine set -> coarse set (set ids <partition>_k<KK>)
      - [A2_groups_k13, A2_groups_k07]
      - [A2_groups_k13, A1_groups_k10]
      - [A2_herbw_k13, A2_groups_k13]
    features:
      - {name: "b1med:t_ann", label: "Mean annual temperature", unit: "C"}
      - {name: "b1med:t_jfm", label: "Jan-Mar temperature", unit: "C"}
      - {name: "b1med:t_jas", label: "Jul-Sep temperature", unit: "C"}
      - {name: "b1med:p_ann", label: "Annual precipitation", unit: "mm"}
      - {name: "b1med:pf_jfm", label: "Jan-Mar share of precipitation", unit: ""}
      - {name: "b1med:pf_jas", label: "Jul-Sep share of precipitation", unit: ""}
      - {name: "b1med:ai_ann", label: "Aridity index (P/PET)", unit: ""}
      - {name: "b1med:ai_warm", label: "Warm-season aridity (Apr-Sep)", unit: ""}
      - {name: "b1med:lsf_0", label: "Last spring freeze", unit: "doy"}
      - {name: "b1med:ffs_0", label: "Freeze-free season", unit: "days"}
      - {name: "b1med:gdd10", label: "Growing degree days, base 10", unit: "C-days"}
      - {name: "b2med:onset_doy", label: "Warm-season rain onset", unit: "doy"}
      - {name: "b2var:onset_frac", label: "Years with a rain onset", unit: ""}
      - {name: "b2med:ev_warm_5", label: "Warm-season rain days >= 5 mm", unit: "days"}
      - {name: "b2med:ev_cool_5", label: "Cool-season rain days >= 5 mm", unit: "days"}
      - {name: "b2med:dsl_max_warm", label: "Longest warm-season dry spell", unit: "days"}
      - {name: "b2var:cv_p_ann", label: "Year-to-year variability of precipitation (CV)", unit: ""}
      - {name: "b2med:cold_frac", label: "Cold-limited share of the year", unit: ""}
      - {name: "b2med:dry_frac", label: "Moisture-limited share of the year", unit: ""}
      - {name: "static:elev", label: "Elevation", unit: "m"}
      - {name: "herb:open_herb_share", label: "Open herbaceous share (incl. pasture)", unit: ""}
    metrics:                    # Cut B season metrics (cutb_metrics_median); DOY relative to Jan 1
      - {name: sos20, label: "Green-up (20 % of NDVI amplitude)", unit: "doy"}
      - {name: ndvi_peak_doy, label: "NDVI peak", unit: "doy"}
      - {name: eos20, label: "End of season (20 %)", unit: "doy"}
      - {name: gsl20, label: "Green season length", unit: "days"}
      - {name: cure50, label: "Curing (NDII7 50 % decline)", unit: "doy"}
      - {name: ndvi_amp, label: "NDVI amplitude", unit: ""}
      - {name: ndii_amp, label: "NDII7 amplitude", unit: ""}
    obs_sets: [grass_greenup, grass_curing, grass_cured, lfmc_herb_peak, lfmc_woody_peak, inat_flower]
    min_herb_cells: 200         # curves/metrics for the herbaceous cells shown when at least this many

  # Cut A feature blocks. Year label Y: water year Oct(Y-1)-Sep(Y) for precipitation,
  # temperature and aridity; calendar year Y for freeze dates and GDD (fall freezes fall
  # in Oct-Nov). Water years start one year after the first PRISM year.
  features:
    chunk_rows: 60              # grid rows read per chunk (bounds memory per worker)
    block1:                     # decided Oct 6 2026
      seasons:                  # water-year seasons (months)
        ond: [10, 11, 12]
        jfm: [1, 2, 3]
        amj: [4, 5, 6]
        jas: [7, 8, 9]
      warm_seasons: [amj, jas]  # for the warm-season aridity index
      gdd_bases: [5, 10]        # deg C; daily mean = (tmin + tmax) / 2
      freeze_thresholds: [0, -2.2]   # tmin <= threshold; 0 primary, -2.2 sensitivity
      spring_end_doy: 181       # last spring freeze before Jul 1; first fall freeze after
    block2:                     # decided Oct 7 2026 (event size, onset rule); rest as noted
      event_mm: [5, 2.5, 10]    # rain-event thresholds (mm/day); first = primary, others sensitivity
      dry_day_mm: 1             # dry day for dry spells: ppt < this (above PRISM drizzle noise)
      warm_months: [4, 5, 6, 7, 8, 9]   # warm season for events and dry spells (AMJ + JAS)
      cool_months: [10, 11, 12, 1, 2, 3] # cool season for events (OND + JFM)
      dry_spell_days: 20        # count warm-season dry spells at least this long
      onset:                    # warm-season rain onset, calendar year Y
        start_doy: 121          # search from May 1 (DOY 121; 122 in leap years is fine)
        end_doy: 273            # ... to Sep 30; no onset -> end_doy + 1 (censored)
        window_days: 10         # onset day d: wet day and ppt(d .. d + 9) >= total_mm
        total_mm: 20
        check_days: 30          # false-start check: no dry spell >= max_dry_spell in d+1 .. d+30
        max_dry_spell: 20
      hard_freeze: -2.2         # "false start": GDD5 accumulated before the last spring tmin <= this
      gdd_base: 5
      limit:                    # rule-based limiting days (water year), no GSI
        cold_tmean: 5           # cold-limited: daily mean < 5 C
        window_days: 30         # moisture-limited: trailing 30-day P < dry_ratio x 30-day PET
        dry_ratio: 0.5

    # Block 3 / GSI (scripts/12_gsi.R, R/gsi.R; decided Oct 8 2026, Mike: "go with your
    # defaults"). Daily GSI per year from PRISM on the grid, ported from gsi-scout R/gsi.R.
    # Two parameter sets (national literature defaults vs FEMS operational), three moisture
    # options (none / 28-day precipitation sum / KBDI ramp) and a no-VPD sensitivity run.
    # Each set keeps its own smoothing window and green-up threshold.
    gsi:
      chunk_rows: 15              # grid rows per chunk (cells x ~820 days per matrix)
      photo_method: geometric     # FAO-56 daylength (gsi-scout default)
      persist: 3                  # days on the far side of the green-up threshold to switch phase
      spinup_from_prev_jan: true  # series starts Jan 1 of Y-1 (smoothing, precipitation sum, KBDI spin-up)
      season_halfwidth_days: 183  # relative crossings searched within +/- this of the peak (as Cut B)
      min_amp: 0.05               # GSI amplitude below this -> no season (sos/eos NA)
      kbdi:
        lo: 200                   # TAMU/TICC bands, decreasing ramp (gsi-scout idx_kbdi)
        hi: 600
        interception_in: 0.2      # per rain event
        # mean annual precipitation from the PRISM years available (2001-2025), written once
        # to static/kbdi_map.tif (gsi-scout uses 1991-2020)
      param_sets:
        nfdrs:                    # NFDRS2016 literature (Jolly et al. 2024 Table 5); NFDRS4 code: 21 d, GU 0.5
          tmin: [-2, 5]
          vpd: [900, 4100]        # Pa, decreasing
          photo_h: [10, 11]
          precip: {window: 28, lo: 0, hi: 10}      # mm over the window
          smooth: 21
          greenup: 0.5
        fems:                     # FEMS operational (gsi-scout scout_defaults)
          tmin: [-2, 5]
          vpd: [1956, 3882]
          photo_h: [11, 12]
          precip: {window: 28, lo: 10.16, hi: 20.32}
          smooth: 28
          greenup: 0.3
      moisture: [none, precip, kbdi]
      extra_variants:             # sensitivity: no VPD ramp
        - {param_set: nfdrs, moisture: precip, vpd: false}
        - {param_set: fems, moisture: precip, vpd: false}

  # Cut A clustering (scripts/20_cluster_a1.R; A2/A3 add blocks 2-3 the same way).
  # Features are the across-year medians, standardized; skewed ones log-transformed;
  # PCA within each block; each block scaled to a set total variance (Block 1 = 1).
  clustering:
    seed: 20261006
    a1:
      block1: [t_ond, t_jfm, t_amj, t_jas, p_ann, pf_ond, pf_jfm, pf_amj, pf_jas,
               ai_ann, ai_warm, lsf_0, fff_0, gdd5, gdd10]
      log: [p_ann, ai_ann, ai_warm]  # log10 before standardizing
      static: [elev, lat]
      static_weight: 0.25            # static block variance relative to Block 1
      sensitivity_static_weight: 0   # second run without static, compared by ARI
      # Variants (Rscript scripts/20_cluster_a1.R <profile> [variant,...]). Output dir is
      # clusters/a1 for `base` (first run, Oct 7) and clusters/a1_<variant> otherwise.
      #   groups: Block 1 split into feature groups that share the block's variance equally
      #           (null = one group, i.e. temperature dominates by feature count).
      #   cell_weight: weight cells by a herb_share.tif layer: floor + (1 - floor) * share.
      default_variants: [a3_groups, a3_groups_novpd, a3_groups_kbdi]   # A1 ran Oct 7, A2 Oct 7
      variants:
        base:
          groups: null
          cell_weight: null
        groups:
          groups: &b1_groups
            temperature: [t_ond, t_jfm, t_amj, t_jas, lsf_0, fff_0, gdd5, gdd10]
            moisture: [p_ann, ai_ann, ai_warm]
            seasonality: [pf_ond, pf_jfm, pf_amj, pf_jas]
          cell_weight: null
        groups_herbw:
          groups: *b1_groups
          cell_weight: {layer: open_herb_share, floor: 0.1}
        # A2 = A1 (groups) + Block 2 as its own block with equal weight (plan: blocks weighted
        # equally). Features are "<source>:<band>" with sources b2med / b2iqr / b2var (Block 2
        # median / IQR / variability) and b1iqr (Block 1 IQR). Four groups share Block 2 equally.
        a2_groups:
          out: a2_groups
          compare_to: a1_groups
          groups: *b1_groups
          cell_weight: null
          block2: &b2_block
            weight: 1
            log1p: ["b2med:ev_warm_5", "b2med:ev_cool_5", "b2med:dsl_max_warm"]   # log10(x + 1)
            groups:
              timing: ["b2med:onset_doy", "b2iqr:onset_doy", "b2var:onset_frac", "b2med:gdd5_lhf", "b1iqr:lsf_0"]
              pulses: ["b2med:ev_warm_5", "b2med:ev_cool_5", "b2med:dsl_max_warm", "b2med:n_dry20_warm"]
              limiting: ["b2med:cold_frac", "b2med:dry_frac"]
              variability: ["b2var:cv_p_ann", "b2var:cv_p_warm", "b2var:sd_t_amj"]
        a2_groups_herbw:
          out: a2_groups_herbw
          compare_to: a1_groups_herbw
          groups: *b1_groups
          cell_weight: {layer: open_herb_share, floor: 0.1}
          block2: *b2_block
        # A3 = A2 (groups) + Block 3: GSI features from 12_gsi.R as a third equally weighted
        # block (Oct 9 2026). Sources g3med / g3iqr = across-year median / IQR of the GSI variant
        # named in gsi_variant (summaries/gsi_<variant>_*). Primary: FEMS operational settings
        # with the 28-day precipitation ramp (the GSI as run today); sensitivity runs without
        # the VPD ramp (PRISM VPD least reliable) and with the KBDI ramp (best moisture option in
        # the Oct 8-9 model test). Constant features (lim_vpd without VPD) are dropped.
        a3_groups:
          out: a3_groups
          compare_to: a2_groups
          groups: *b1_groups
          cell_weight: null
          block2: *b2_block
          block3:
            gsi_variant: fems_precip
            weight: 1
            log1p: &b3_log ["g3med:n_pulses"]
            groups: &b3_groups
              timing: ["g3med:sos20", "g3med:peak_doy", "g3med:eos50"]
              spread: ["g3iqr:sos20", "g3iqr:eos50"]
              activity: ["g3med:gsi_mean", "g3med:green_days", "g3med:n_pulses"]
              limiting: ["g3med:lim_tmin", "g3med:lim_vpd", "g3med:lim_photo", "g3med:lim_moist"]
        a3_groups_novpd:
          out: a3_groups_novpd
          compare_to: a3_groups
          groups: *b1_groups
          cell_weight: null
          block2: *b2_block
          block3:
            gsi_variant: fems_precip_novpd
            weight: 1
            log1p: *b3_log
            groups: *b3_groups
        a3_groups_kbdi:
          out: a3_groups_kbdi
          compare_to: a3_groups
          groups: *b1_groups
          cell_weight: null
          block2: *b2_block
          block3:
            gsi_variant: fems_kbdi
            weight: 1
            log1p: *b3_log
            groups: *b3_groups
    # Sites used to check region boundaries (which region each falls in, per k).
    check_points:
      - {name: "Santa Rita (AZ desert grassland)", lon: -110.88, lat: 31.80}
      - {name: "CPER (CO shortgrass)", lon: -104.75, lat: 40.82}
      - {name: "Konza (KS tallgrass)", lon: -96.56, lat: 39.09}
      - {name: "Sierra Foothills (CA annual grass)", lon: -121.29, lat: 39.25}
      - {name: "Chino Valley (AZ grassland)", lon: -112.45, lat: 34.85}
      - {name: "Columbus OH (Corn Belt / forest)", lon: -83.00, lat: 40.00}
      - {name: "Barstow CA (Mojave)", lon: -117.02, lat: 34.90}
      - {name: "Sevilleta NM (desert grassland)", lon: -106.88, lat: 34.35}
      - {name: "Cheyenne WY (mixed grass)", lon: -104.82, lat: 41.14}
      - {name: "Oklahoma tallgrass (Tallgrass Prairie Pres.)", lon: -96.42, lat: 36.84}
      - {name: "Boise ID (sagebrush steppe)", lon: -116.20, lat: 43.62}
    pca_var: 0.99                    # variance kept by the within-block PCA
    k_range: [4, 30]
    kmeans_nstart: 5
    weighted_sample: 150000          # weighted k-means: start from a weight-proportional sample
    stability:                       # spatial-block subsampling (Lange et al. style)
      n_boot: 10
      block_deg: 2                   # blocks of block_deg x block_deg degrees
      frac: 0.5                      # share of blocks drawn per fit
      n_fit: 60000                   # cells per fit, sampled from the drawn blocks
      n_eval: 60000                  # cells (all CONUS) on which the two fits are compared
    k_detail: null                   # k values for GMM/Ward/maps; null = stability picks
    n_detail: 3                      # how many k to pick from the stability curve
    gmm:
      model: [VVV, VVI, EEE]         # first that fits; full covariance (VVV) can be singular in A2
      n_fit: 25000
      n_init_subset: 2000
    ward:
      n_micro: 1500                  # k-means micro-clusters, then Ward on their centroids
      cuts: [2, 3, 4, 6, 8]          # extra coarse cuts for roll-up (plus the k_detail values)

  # Project page figures (scripts/90_report_figs.R -> report/figs). Sample points are
  # illustrative grassland locations; points outside a profile's extent are skipped.
  report:
    extent_label: "CONUS"
    curve_years: 3              # Cut B curves: most recent N years available
    # Region maps (figure `regions`): partitions from `evaluation: partitions`. Colours are
    # matched to the first panel where regions overlap, so similar regions look alike.
    region_maps:
      - {partition: A1_groups, k: 10, title: "Climate A1 (seasonal climate), 10 regions"}
      - {partition: A2_groups, k: 7, title: "Climate A2 (+ timing, variability), 7 regions"}
      - {partition: A2_groups, k: 13, title: "Climate A2, 13 regions"}
      - {partition: B_raw, k: 7, title: "Satellite curves (level + shape), 7 regions"}
      - {partition: B_raw, k: 13, title: "Satellite curves (level + shape), 13 regions"}
      - {partition: B_shape, k: 13, title: "Satellite curves (timing only), 13 regions"}
    # Observation sets shown in figure `eval_obs` and the summary table (31_obs_regions.R)
    eval_sets: [grass_greenup, grass_curing, grass_cured, lfmc_herb_peak, lfmc_woody_peak, inat_flower]
    sample_points:
      - {name: "SE Arizona desert grassland (Santa Rita Exp. Range)", lon: -110.88, lat: 31.80}
      - {name: "Colorado shortgrass steppe (Central Plains Exp. Range)", lon: -104.75, lat: 40.82}
      - {name: "Kansas tallgrass prairie (Konza Prairie)", lon: -96.56, lat: 39.09}
      - {name: "California annual grassland (Sierra Foothills)", lon: -121.29, lat: 39.25}
      - {name: "N Arizona grassland (Chino Valley)", lon: -112.45, lat: 34.85}

  # scripts/91_sync_from_p720.R (laptop): where things live on the P720. The host itself
  # comes from the GSI_P720_HOST environment variable (~/.Renviron), not from git.
  sync:
    remote_repo: "~/RProjects/gsi-pheno-regions"
    remote_data_root: "~/data/gsi-pheno-regions"
    fire_tables: [fod, mtbs]  # 91 fire: also copy these steps' per-record tables (not FIRMS: too big)

# Laptop development: small Arizona box, recent complete years, 2 workers.
dev:
  run_name: dev
  bbox:
    xmin: -115.0
    ymin: 31.25
    xmax: -108.95
    ymax: 37.05
  years:
    start: 2023
    end: 2025
  workers: 2
  memfrac: 0.3
  report:
    extent_label: "Arizona test area (dev)"
  synchrony:
    min_years: 2                # dev has 3 years
  gsi_model:
    n_sample: 300
    min_sat_years: 2
    min_cells: 15
    conus_fit_cells: 150
    maxit: 30
    restarts: 1
    workers: 2
  gsi_curing:
    moisture: [kbdi, precip60]
    cross: [rel, abs_nfdrs4]
    k: [7]
    maxit: 30
    workers: 2

# Few-minute smoke test of the whole chain (5 days, 2 variables, 1 year).
# Uses 2022 (outside the dev years) so smoke tests don't re-fetch files dev already
# downloaded: PRISM refuses a third download of the same file within 24 h.
test:
  inherits: dev
  run_name: test
  years:
    start: 2022
    end: 2022
  prism:
    vars: [ppt, tmax]
    max_days_per_year: 5

# P720 production: CONUS, many workers.
# years: download order, not the study period (still open in the plan doc). 2001 is the
# first full MODIS year, so 2001-2025 is needed for any Cut A vs Cut B comparison. To extend
# back later, lower `start` and rerun; finished years are skipped.
full:
  run_name: full
  bbox: null
  years:
    start: 2001
    end: 2025
  # P720: 2 x Xeon Gold 6148 (40 cores / 80 threads), 125 GB RAM, RTX 3090 (24 GB).
  # `workers` is the default (disk-bound steps); `workers_by_step` sets CPU/memory-bound
  # steps (one worker per year; years run in one round when workers >= years).
  # GSI_WORKERS overrides both for one run. memfrac is capped at 0.6 / workers per worker.
  workers: 8
  workers_by_step:
    gsi: 24                   # ~2 GB per worker
    block1: 16
    block2: 16
    cutb_curves: 16
    fire_link: 11             # 22 sensor-years -> two rounds
    fire_forecast: 8          # 67: one year of cues per worker (~5 GB each)
    fire_dfm: 16              # row chunks, all PRISM years per chunk (~4 GB peak per worker at 2 rows)
  memfrac: 0.08
  report:
    # CONUS figures are written next to the data (<run_dir>/report_figs), not into the
    # repo, so the P720's git checkout stays clean; 91_sync_from_p720.R copies them into
    # report/figs on the laptop, where they are committed. On the laptop (windows) full
    # figures go straight to report/figs (figures that need laptop-only data: evaluation).
    figs_in_run_dir:
      windows: false
      linux: true
